services:

  postgres:
    image: postgres:17-alpine
    container_name: qalytix-postgres
    environment:
      POSTGRES_DB: qalytix
      POSTGRES_USER: qalytix
      POSTGRES_PASSWORD: qalytix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalytix -d qalytix"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./qalytix-backend
      dockerfile: Dockerfile
    container_name: qalytix-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/qalytix
      DB_USERNAME: qalytix
      DB_PASSWORD: qalytix
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
    ports:
      - "8080:8080"
    profiles:
      - full

volumes:
  postgres_data:
