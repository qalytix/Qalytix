spring:
  application:
    name: qalytix-backend
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/qalytix
    username: qalytix
    password: qalytix
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-min-256-bits-long-replace-in-production-env}
    expiry-ms: 900000          # 15 minutes
    refresh-expiry-ms: 604800000  # 7 days
  base-url: http://localhost:3000
  jenkins:
    poll-delay-ms: 300000   # 5 minutes

logging:
  level:
    com.qalytix: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS:900000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  base-url: ${APP_BASE_URL}

logging:
  level:
    com.qalytix: INFO
    org.springframework.security: WARN
