# Run Qalytix from Docker Hub — no source code required.
#
# Quick start:
#   1. cp .env.example .env   (then set JWT_SECRET)
#   2. docker compose -f docker-compose.hub.yml up -d
#   3. Open http://localhost

services:

  postgres:
    image: postgres:17-alpine
    container_name: qalytix-postgres
    environment:
      POSTGRES_DB:       ${DB_NAME:-qalytix}
      POSTGRES_USER:     ${DB_USER:-qalytix}
      POSTGRES_PASSWORD: ${DB_PASS:-qalytix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qalytix} -d ${DB_NAME:-qalytix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: sddmhossain/qalytix:latest
    container_name: qalytix
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL:       jdbc:postgresql://postgres:5432/${DB_NAME:-qalytix}
      DB_USERNAME:  ${DB_USER:-qalytix}
      DB_PASSWORD:  ${DB_PASS:-qalytix}
      JWT_SECRET:   ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
    ports:
      - "${PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres_data:
